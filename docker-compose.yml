version: "3.9"

services:
  strapi:
    image: kunal1234t/pravesh-backend:latest
    container_name: pravesh-backend
    restart: unless-stopped

    env_file:
      - .env

    environment:
      - NODE_OPTIONS=--max-old-space-size=1024

    ports:
      - "6969:6969"

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:alpine
    container_name: pravesh-redis
    restart: unless-stopped

    command:
      - redis-server
      - --notify-keyspace-events
      - Ex
      - --requirepass
      - ${REDIS_PASSWORD:-Pr@vesh_R3dis_2026}

    deploy:
      resources:
        limits:
          memory: 512M

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD:-Pr@vesh_R3dis_2026}",
          "PING"
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    image: mysql:8.0
    container_name: pravesh-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: iiitnBX248
      MYSQL_DATABASE: pravesh

    ports:
      - "3307:3306"

    deploy:
      resources:
        limits:
          memory: 1G

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

volumes:
  mysql_data: